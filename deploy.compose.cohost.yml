name: carbon-platform
services:
  db:
    image: adc-clinic-postgres:20261111
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      default:
        aliases: [carbonspeed-db]
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=40]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U carbonspeed -d carbonspeed']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 192m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    networks:
      default:
        aliases: [carbonspeed-redis]
    command: [redis-server, --maxmemory, 32mb, --maxmemory-policy, allkeys-lru, --save, '']
    mem_limit: 64m
    restart: unless-stopped
  backend:
    image: carbonspeed-backend:20261120-bi-decisions-r2
    env_file: ${CARBON_RUNTIME_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@carbonspeed-db:5432/${POSTGRES_DB}
      DB_TENANT_ISOLATION_ENABLED: "true"
      REDIS_URL: redis://carbonspeed-redis:6379/0
    volumes:
      - storage:/app/storage
      - models:/app/models_cache
    ports:
      - '127.0.0.1:18080:8000'
    networks:
      default:
      edge:
        aliases: [carbonspeed-api]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 900m
    cpus: 1.5
    pids_limit: 256
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    restart: unless-stopped
networks:
  edge:
    external: true
    name: adc-clinic_default
volumes:
  database:
  storage:
  models:
