services:
  db:
    image: postgres:18
    container_name: carbonspeed-db
    environment:
      POSTGRES_USER: carbonspeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: carbonspeed
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carbonspeed-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonspeed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: carbonspeed-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonspeed-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://carbonspeed:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/carbonspeed
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATA_ENC_KEY: ${DATA_ENC_KEY:-}
      HF_ENDPOINT: https://hf-mirror.com
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - carbonspeed-models:/app/models_cache
      - carbonspeed-storage:/app/storage
    restart: unless-stopped

  # ---- 监控栈（可选：docker compose --profile monitoring up -d） ----
  prometheus:
    image: prom/prometheus:latest
    container_name: carbonspeed-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: carbonspeed-alertmanager
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: carbonspeed-grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    restart: unless-stopped

volumes:
  carbonspeed-db-data:
  carbonspeed-models:
  carbonspeed-storage:
