# Prometheus 抓取与告警规则（docker compose 监控栈）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: carbonspeed-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
