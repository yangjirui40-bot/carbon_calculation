name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbonspeed
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: carbonspeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbonspeed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+psycopg2://carbonspeed:testpass@localhost:5432/carbonspeed
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_BACKEND: redis
      SKIP_OCR: "1"          # CI 无 AI 模型缓存，跳过 OCR 流水线段
      HF_ENDPOINT: https://hf-mirror.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（CPU torch）
        run: |
          pip install --default-timeout=300 --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 导入与迁移检查
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('routes OK')"
          python -m alembic upgrade head

      - name: 端到端测试
        run: python tests/test_api.py

      - name: 算法包回归
        run: cd algorithm_pkg && python -m unittest discover -s tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查 + 生产构建
        working-directory: frontend
        run: npm run build
